# 본 실행: docker compose up -d --build (프로젝트 이름 ripple)
# 시험용으로 따로 띄울 때는 -p ripple-check와 WEB_PORT·BACKUP_HOST_DIR를 바꿔 볼륨·포트·백업 폴더를 나눈다(docs/DEVELOPMENT.md).
name: ripple

services:
  # 마이그레이션을 적용하고 끝난다(worker 이미지 사용). worker·web은 이것이 성공한 뒤 뜬다.
  migrate:
    build:
      context: .
      target: worker
    command: ["node", "--enable-source-maps", "dist/worker/migrate.mjs"]
    environment:
      DATABASE_PATH: /data/ripple.db
      TZ: Asia/Seoul
    volumes:
      - ripple-data:/data

  # DB에 쓰는 유일한 프로세스. 내부 API는 compose 네트워크 안에서만 열린다(ports 없음).
  worker:
    build:
      context: .
      target: worker
    environment:
      DATABASE_PATH: /data/ripple.db
      WORKER_HOST: 0.0.0.0
      WORKER_PORT: "4000"
      TZ: Asia/Seoul
      # .env에서 읽는다. 외부 API 키는 worker에만 넘긴다(AI 호출·수집은 worker가 함).
      WORKER_API_TOKEN: ${WORKER_API_TOKEN:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      # 자동 백업(D-27): 매일 04:00(한국 시간)에 여기로 남기고 최근 7개만 둔다.
      BACKUP_DIR: /backups
    volumes:
      - ripple-data:/data
      # 백업은 이 컴퓨터의 폴더에 둔다(Docker를 지워도 남게). DB 자체는 WAL 때문에 named volume에 둔다.
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 1s
    restart: unless-stopped

  # 화면. DB는 읽기 전용으로 열고, 쓰기는 worker 내부 API에 요청한다(SPEC D-36).
  web:
    build:
      context: .
      target: web
    environment:
      DATABASE_PATH: /data/ripple.db
      WORKER_URL: http://worker:4000
      TZ: Asia/Seoul
      # 로그인 비밀번호·세션 서명 키는 .env에서 읽어 web에만 넘긴다. 없거나 짧으면 web이 시작하지 않는다.
      APP_PASSWORD: ${APP_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      WORKER_API_TOKEN: ${WORKER_API_TOKEN:-}
      # 상태 화면에 외부 접속 임시 주소를 보여 주려고 cloudflared에 묻는다(9단계).
      TUNNEL_METRICS_URL: http://tunnel:20241
    volumes:
      - ripple-data:/data
    ports:
      # 이 컴퓨터에서만 열린다. 밖(휴대폰)에서는 아래 tunnel의 임시 주소로 들어온다.
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      worker:
        condition: service_healthy
    restart: unless-stopped

  # 외부 접속(9단계): Cloudflare Quick Tunnel. 계정 없이 임시 주소(*.trycloudflare.com)를 받는다.
  # 주소는 다시 켤 때마다 바뀐다. 상태 화면 또는 `docker compose logs tunnel`에서 확인한다(로그인으로 보호, FR-1).
  # 메트릭 서버(20241)는 compose 내부망에서 web만 읽는다(/quicktunnel = 지금 주소). 호스트에는 열지 않는다.
  tunnel:
    image: cloudflare/cloudflared:2026.10.0
    command:
      ["tunnel", "--metrics", "0.0.0.0:20241", "--url", "http://web:3000"]
    depends_on:
      - web
    restart: unless-stopped

volumes:
  # SQLite 파일. WAL이 동작하도록 두 컨테이너가 같은 named volume을 쓴다(호스트 폴더 바인드 금지).
  ripple-data:
