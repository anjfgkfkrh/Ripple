[workspace]
members = ["ripple"]
resolver = "3"

# 버전은 정확히 고정한다(docs/RUST_MIGRATION.md 2장). 올리지 않는다.
[workspace.dependencies]
tokio = { version = "=1.54.1", features = ["rt", "macros", "time", "sync", "signal", "net", "fs"] }
axum = "=0.8.9"
axum-extra = { version = "=0.12.6", features = ["cookie"] }
tower-http = { version = "=0.7.1", features = ["trace", "timeout"] }
reqwest = { version = "=0.13.5", features = ["charset", "http2", "json", "stream"] }
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }
rusqlite_migration = "=2.6.0"
askama = "=0.16.1"
serde = { version = "=1.0.229", features = ["derive"] }
# preserve_order: JS 객체처럼 넣은 키 순서를 지킨다(설계 8장). indexmap은 이미 h2가 쓰는 크레이트다.
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
chrono = { version = "=0.4.45", default-features = false, features = ["std", "clock"] }
chrono-tz = "=0.10.4"
regex = "=1.13.1"
encoding_rs = "=0.8.44"
url = "=2.5.8"
sha2 = "=0.11.1"
hmac = "=0.13.0"
base64 = "=0.23.1"
thiserror = "=2.0.21"
anyhow = "=1.0.104"
clap = { version = "=4.6.7", features = ["derive"] }
tempfile = "=3.27.0"
wiremock = "=0.6.5"

[workspace.lints.rust]
unsafe_code = "forbid"
