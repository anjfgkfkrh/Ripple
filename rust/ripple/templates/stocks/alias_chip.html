<form class="inline-flex items-center gap-1" hx-post="/stocks/{{ alias.stock_id }}/aliases/remove" hx-target="this" hx-swap="outerHTML"><input type="hidden" name="alias" value="{{ alias.text }}"><span class="inline-flex h-5 items-center gap-0.5 rounded-4xl border border-border pl-2 text-xs text-foreground" data-testid="stock-alias">{{ alias.text }}<button type="submit" data-slot="button" aria-label="{{ alias.remove_aria }}" data-testid="alias-remove" class="inline-flex size-5 items-center justify-center rounded-4xl text-muted-foreground outline-none hover:text-foreground focus-visible:ring-3 focus-visible:ring-ring/50">&times;</button></span>{% if let Some(error) = alias.error %}<span role="alert" class="text-xs text-destructive">{{ error }}</span>{% endif %}</form>
